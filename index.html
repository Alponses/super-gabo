<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="theme-color" content="#385bd8">
  <title>Gabo Bros</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="./phaser.min.js"></script>
  <script type="module" src="./game.js"></script>
</head>

<body>
  <main id="app">
    <div id="game"></div>
    <div id="mobile-controls" aria-label="Controles tactiles">
      <div class="control-cluster control-cluster-left">
        <button class="touch-control" type="button" data-control="left" aria-label="Izquierda">‹</button>
        <button class="touch-control" type="button" data-control="right" aria-label="Derecha">›</button>
      </div>
      <div class="control-cluster control-cluster-right">
        <button class="touch-control" type="button" data-control="up" aria-label="Saltar">⌃</button>
        <button class="touch-control" type="button" data-control="down" aria-label="Abajo">⌄</button>
      </div>
    </div>
  </main>
</body>

</html>
